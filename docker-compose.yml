services:
  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      CORS_ORIGINS: '["http://localhost:8080"]'
    volumes:
      - api-data:/app/data
    ports:
      - "8000:8000"

  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_PROXY: http://api:8000
    volumes:
      - ./:/app
      - /app/node_modules
    ports:
      - "8080:8080"
    depends_on:
      - api

volumes:
  api-data:
